<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Intellicamp Feature Orbit</title>
<style>
  :root{
    --page:#eef2fb;
    --cyan:#4fd2ff;
  }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --page:#0d1224; } }
  :root[data-theme="dark"]{ --page:#0d1224; }
  html,body{margin:0;background:var(--page);}
  body{min-height:100vh;display:flex;align-items:flex-start;justify-content:center;padding:24px 16px;box-sizing:border-box;}

  /* ===== IntellicampFeatureOrbit ===== */
  .ic-orbit{position:relative;width:100%;max-width:600px;aspect-ratio:1198/1264;overflow:hidden;border-radius:0 0 48px 48px;}
  .ic-stage{position:absolute;left:0;top:0;width:1198px;height:1264px;transform-origin:0 0;}
  .ic-stage > *{position:absolute;}
  .ic-bg{left:0;top:0;width:1198px;height:1264px;}
  .ic-svg{left:0;top:0;width:1198px;height:1264px;overflow:visible;}
  .ic-body{will-change:transform;}
  .ic-hand{will-change:transform;}
  .ic-cards{left:0;top:0;width:1198px;height:1264px;}

  /* FeatureOrbitCard: the original card artwork, one image per card */
  .ic-card{position:absolute;left:0;top:0;will-change:transform,filter;transform-origin:50% 50%;}
  .ic-card .ic-cardimg{position:absolute;display:block;max-width:none;}
  .ic-card .ic-icon{position:absolute;display:block;max-width:none;transform-origin:50% 50%;}
  .ic-card .ic-sel{position:absolute;inset:-3px;border-radius:19px;pointer-events:none;opacity:0;
    box-shadow:0 0 0 2.5px var(--cyan),0 0 26px rgba(79,210,255,.85),0 0 60px rgba(60,150,255,.45);}

  /* TouchRipple + fingertip glow */
  .ic-fx{left:0;top:0;width:1198px;height:1264px;pointer-events:none;}
  .ic-glow{position:absolute;left:0;top:0;width:104px;height:104px;margin:-52px 0 0 -52px;border-radius:50%;
    background:
      radial-gradient(circle,rgba(255,255,255,1) 0 13%,rgba(210,248,255,1) 18%,rgba(90,210,255,.9) 25%,rgba(90,210,255,0) 33%),
      radial-gradient(circle,rgba(0,0,0,0) 0 36%,rgba(150,232,255,.95) 39%,rgba(150,232,255,.0) 44%),
      radial-gradient(circle,rgba(70,180,255,.45) 0 30%,rgba(70,180,255,.18) 55%,rgba(70,180,255,0) 72%);}
  .ic-ripple{position:absolute;left:0;top:0;width:70px;height:70px;margin:-35px 0 0 -35px;border-radius:50%;
    border:4px solid rgba(110,225,255,.95);box-shadow:0 0 18px rgba(79,210,255,.8),inset 0 0 12px rgba(79,210,255,.5);opacity:0;}

  @media (prefers-reduced-motion: reduce){ .ic-card{transition:none} }
</style>
</head>
<body>

<div class="ic-orbit" id="orbit" role="img" aria-label="A student surrounded by six Intellicamp AI features: AI Paper Generation, Instant AI Exam, Exam Insights, Progress Analytics, Performance Tracking and Smart Study Material. He spins them around him and taps Smart Study Material.">
  <div class="ic-stage">
    <img class="ic-bg" src="assets/background.jpg" alt="">
    <!-- OrbitalTrack -->
    <svg class="ic-svg" viewBox="0 0 1198 1264" aria-hidden="true">
      <defs>
        <linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#7fd6ff"/><stop offset=".5" stop-color="#2f8dff"/><stop offset="1" stop-color="#7fd6ff"/>
        </linearGradient>
        <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter>
        <filter id="bloom" x="-200%" y="-200%" width="500%" height="500%"><feGaussianBlur stdDeviation="7"/></filter>
        <radialGradient id="nodeGrad"><stop offset="0" stop-color="#e9f8ff"/><stop offset=".35" stop-color="#4fb6ff"/><stop offset="1" stop-color="#1667ff"/></radialGradient>
      </defs>
      <g id="ring" transform="translate(610 790)">
        <circle r="270" fill="none" stroke="#3aa2ff" stroke-opacity=".45" stroke-width="12" filter="url(#soft)"/>
        <circle r="270" fill="none" stroke="url(#ringGrad)" stroke-opacity="1" stroke-width="3.4"/>
        <circle r="244" fill="none" stroke="#4bb4ff" stroke-opacity=".75" stroke-width="2" stroke-dasharray="3 9" stroke-linecap="round"/>
        <g id="nodes"></g>
        <g id="orbitLight">
          <circle r="14" fill="#7fdcff" opacity=".55" filter="url(#bloom)"/>
          <circle r="5" fill="#f2fbff"/>
        </g>
      </g>
      <!-- swipe light trail (artboard space) -->
      <path id="trail" d="" fill="none" stroke="#9fe6ff" stroke-width="6" stroke-linecap="round" opacity="0" filter="url(#soft)"/>
    </svg>
    <!-- StudentImageLayer -->
    <img class="ic-body" src="assets/student-body.png" alt="" style="left:297px;top:598px;width:579px;height:564px">
    <div class="ic-cards" id="cards"></div>
    <!-- StudentHandInteraction -->
    <img class="ic-hand" id="hand" src="assets/student-hand.png" alt="" style="left:290px;top:670px;width:190px;height:210px;transform-origin:85px 180px">
    <div class="ic-fx" aria-hidden="true">
      <div class="ic-glow" id="glow"></div>
      <div class="ic-ripple" id="ripple"></div>
    </div>
  </div>
</div>

<script src="assets/gsap.min.js"></script>
<script>
/* Intellicamp Feature Orbit — all coordinates are on a 1198×1264 reference artboard (2× the email hero). */
(function(){
  const ORBIT = {"cx": 610.0, "cy": 790.0, "r": 270.0, "theta": {"paper": -1.66971, "instant": -0.76494, "insights": 0.00517, "progress": 1.9849, "perf": 2.6725, "smart": -2.58543}, "depth": 0.07, "stopDeg": 360};   // every card centre rides exactly on this circle
  const HAND  = { x:290, y:670, pivot:[85,180], tip:[124,36] };   // hand image box, wrist pivot + fingertip (image px)
  const CARDS = [
    {k:'paper', box:[490, 482, 188, 92], m:12, icon:[10, 10, 48, 48]},
    {k:'instant', box:[716, 566, 162, 89], m:12, icon:[10, 10, 45, 46]},
    {k:'insights', box:[726, 748, 155, 86], m:12, icon:[12, 10, 47, 46]},
    {k:'progress', box:[411, 992, 180, 92], m:12, icon:[11, 10, 54, 52]},
    {k:'perf', box:[267, 872, 173, 96], m:12, icon:[10, 9, 52, 51]},
    {k:'smart', box:[283, 602, 210, 100], m:12, icon:[12, 12, 55, 52]}
  ];
  const SELECT = 'smart';                 // the card the student taps
  const CONFIG = { loop:true };

  const root  = document.getElementById('orbit');
  const stage = root.querySelector('.ic-stage');
  const cardsEl = document.getElementById('cards');
  const hand = document.getElementById('hand');
  const glow = document.getElementById('glow');
  const ripple = document.getElementById('ripple');
  const trail = document.getElementById('trail');
  const light = document.getElementById('orbitLight');

  /* ---------- responsive: scale the whole artboard ---------- */
  const fit = () => { stage.style.transform = 'scale(' + (root.clientWidth/1198) + ')'; };
  new ResizeObserver(fit).observe(root); fit();

  /* ---------- FeatureOrbitCard ---------- */
  const cards = CARDS.map(c => {
    const el = document.createElement('div');
    el.className = 'ic-card'; el.dataset.k = c.k;
    el.style.width = c.box[2]+'px'; el.style.height = c.box[3]+'px';
    const W = c.box[2]+2*c.m, H = c.box[3]+2*c.m, [ix,iy,iw,ih] = c.icon;
    el.innerHTML = '<img class="ic-cardimg" alt="" src="assets/card-'+c.k+'.png" style="left:'+(-c.m)+'px;top:'+(-c.m)+'px;width:'+W+'px;height:'+H+'px">'
                 + '<img class="ic-icon" alt="" src="assets/icon-'+c.k+'.png" style="left:'+ix+'px;top:'+iy+'px;width:'+iw+'px;height:'+ih+'px">'
                 + '<div class="ic-sel"></div>';
    cardsEl.appendChild(el);
    const a0 = ORBIT.theta[c.k];
    return { ...c, el, icon:el.querySelector('.ic-icon'), sel:el.querySelector('.ic-sel'), a0,
             place:(x,y,s)=>gsap.set(el,{x,y,scale:s,force3D:true}) };
  });
  const byKey = Object.fromEntries(cards.map(c=>[c.k,c]));

  /* ---------- orbital mathematics (one shared rotation) ---------- */
  const orbitState = { rotation:0 };
  const fxState = { tap:1 };                      // press-bounce multiplier for the selected card
  const STOP = ORBIT.stopDeg*Math.PI/180;         // wheel stops with Smart Study Material beside the fingertip
  function updateOrbitPositions(){
    const r = orbitState.rotation;
    for (const c of cards){
      const a = c.a0 + r;
      const cx = ORBIT.cx + ORBIT.r*Math.cos(a);
      const cy = ORBIT.cy + ORBIT.r*Math.sin(a);
      const d  = Math.sin(a) - Math.sin(c.a0);     // 0 at rest; + toward the front (bottom), - toward the back (top)
      let s = 1 + ORBIT.depth*d;
      if (c.k === SELECT) s *= fxState.tap;
      c.place(cx - c.box[2]/2, cy - c.box[3]/2, s);
      c.el.style.filter = 'brightness('+(1+0.05*d).toFixed(3)+')';
      c.el.style.zIndex = Math.round(10 + Math.sin(a)*5);
    }
    const la = r - Math.PI*0.75;                    // a soft light rides the orbit with the wheel
    light.setAttribute('transform','translate('+(ORBIT.r*Math.cos(la)).toFixed(1)+' '+(ORBIT.r*Math.sin(la)).toFixed(1)+')');
  }

  /* ---------- OrbitalTrack nodes ---------- */
  const nodesG = document.getElementById('nodes');
  const NODE_ANG = [-150,-96,-50,-12,24,62,118,165];
  const nodes = NODE_ANG.map((d,i) => {
    const a = d*Math.PI/180, g = document.createElementNS('http://www.w3.org/2000/svg','g');
    g.setAttribute('transform','translate('+(ORBIT.r*Math.cos(a)).toFixed(1)+' '+(ORBIT.r*Math.sin(a)).toFixed(1)+')');
    const r = i%3===0 ? 9 : 6;
    g.innerHTML = '<circle r="'+(r*2.4)+'" fill="#58b8ff" opacity=".45" filter="url(#bloom)" class="halo"/><circle r="'+r+'" fill="url(#nodeGrad)" stroke="#bfe9ff" stroke-width="1.5"/>';
    nodesG.appendChild(g); return g.querySelector('.halo');
  });

  /* ---------- StudentHandInteraction ---------- */
  const handState = { rot:0, y:0, s:1 };
  const toRad = d => d*Math.PI/180;
  function tipPos(){
    const [px,py] = HAND.pivot, [tx,ty] = HAND.tip, a = toRad(handState.rot);
    const dx = (tx-px)*handState.s, dy = (ty-py)*handState.s;
    return [HAND.x + px + dx*Math.cos(a) - dy*Math.sin(a), HAND.y + py + dx*Math.sin(a) + dy*Math.cos(a) + handState.y];
  }
  const glowState = { o:0, s:1 };                  // fingertip glow: hidden at rest, shown only while interacting
  function updateHand(){
    gsap.set(hand,{ rotation:handState.rot, y:handState.y, scale:handState.s });
    const [x,y] = tipPos();
    gsap.set(glow,{ x, y, opacity:glowState.o, scale:glowState.s });
  }
  const svg = trail.ownerSVGElement;
  function makeTrail(fromRot,toRot){
    const pts=[]; const save=handState.rot;
    for(let i=0;i<=12;i++){ handState.rot = fromRot+(toRot-fromRot)*i/12; pts.push(tipPos()); }
    handState.rot = save;
    const p = trail.cloneNode(); p.removeAttribute('id');
    p.setAttribute('d','M'+pts.map(q=>q[0].toFixed(1)+' '+q[1].toFixed(1)).join(' L'));
    svg.appendChild(p);
    const len = p.getTotalLength(); p.style.strokeDasharray = len; p.style.strokeDashoffset = len; p.style.opacity = 0;
    return { p, len };
  }

  /* ---------- master timeline ---------- */
  const TAP_TIP = tipPos();                         // contact point for the tap ripple
  function buildTimeline(){
    const tl = gsap.timeline({ repeat: CONFIG.loop ? -1 : 0, onUpdate:()=>{ updateOrbitPositions(); updateHand(); } });
    const swipe = (at, amp=1, dur=0.7) => {
      const tr = makeTrail(-7*amp, 4*amp);       // light trail follows the fingertip arc
      tl.fromTo(tr.p,{ strokeDashoffset:tr.len, opacity:0 },{ strokeDashoffset:0, opacity:.8, duration:dur*0.6, ease:'power2.out', immediateRender:false }, at+dur*0.3)
        .to(tr.p,{ opacity:0, duration:0.5, ease:'power1.out' }, at+dur*0.9);
      tl.to(handState,{ rot:-7*amp, y:6*amp, duration:dur*0.35, ease:'power2.inOut' }, at)
        .to(handState,{ rot:4*amp, y:-8*amp, duration:dur*0.4, ease:'power2.out' }, at+dur*0.35)
        .to(handState,{ rot:0, y:0, duration:dur*0.5, ease:'power2.inOut' }, at+dur*0.75)
        .to(glowState,{ o:.9*amp, s:1.2, duration:dur*0.35, yoyo:true, repeat:1, ease:'sine.inOut' }, at+dur*0.2);
    };
    const others = cards.filter(c=>c.k!==SELECT).map(c=>c.el);

    tl.addLabel('initial', 0)
      .to(nodes,{ opacity:.85, duration:.4, stagger:.05, yoyo:true, repeat:1, ease:'sine.inOut' }, 0)
      .addLabel('swipeStart', 0.8);
    swipe(0.8, 1, 0.7);

    // one smooth 360° turn that eases to a stop with Smart Study Material back on the orbit, right by the fingertip
    tl.addLabel('orbitRotation', 1.3)
      .to(orbitState,{ rotation:STOP, duration:5.9, ease:'sine.inOut' }, 'orbitRotation');
    swipe(3.0, 0.7, 0.6);
    swipe(4.6, 0.6, 0.6);

    tl.addLabel('orbitStop', 7.2)
      .to(others,{ opacity:.62, duration:.5, ease:'power2.out' }, 'orbitStop')

      .addLabel('fingerTap', 7.6)
      .to(glowState,{ o:1, s:1, duration:.16, ease:'power1.out' }, 'fingerTap')
      .to(handState,{ y:-8, s:1.02, duration:.18, ease:'power2.in' }, 'fingerTap')
      .to(handState,{ y:0, s:1, duration:.32, ease:'power2.out' }, 'fingerTap+=0.22')
      .fromTo(ripple,{ x:TAP_TIP[0], y:TAP_TIP[1]-8, scale:.25, opacity:1 },{ scale:2.4, opacity:0, duration:.8, ease:'power2.out', immediateRender:false }, 'fingerTap+=0.18')
      .to(fxState,{ keyframes:[{tap:0.97,duration:.08,ease:'power2.in'},{tap:1.07,duration:.16,ease:'back.out(1.2)'},{tap:1,duration:.22,ease:'power2.inOut'}] }, 'fingerTap+=0.18')
      .to(byKey[SELECT].sel,{ opacity:1, duration:.35, ease:'power2.out' }, 'fingerTap+=0.2')
      .to(byKey[SELECT].icon,{ scale:1.12, duration:.18, yoyo:true, repeat:1, ease:'power2.inOut' }, 'fingerTap+=0.25')
      .to(glowState,{ o:0, duration:.6, ease:'power1.inOut' }, 'fingerTap+=0.6')      // glow gone once the finger is back at rest

      .addLabel('selectionComplete', 8.4)
      .to(byKey[SELECT].sel,{ opacity:.65, duration:.6 }, 'selectionComplete')
      .addLabel('finalHold', 9.0)

      .addLabel('reset', 10.3)
      .to(byKey[SELECT].sel,{ opacity:0, duration:.5 }, 'reset')
      .to(others,{ opacity:1, duration:.5 }, 'reset')
      .set(orbitState,{ rotation:0 }, 11.95)          // 2π ≡ 0: identical positions
      .to({}, { duration:0 }, 12.0);
    return tl;
  }

  /* ---------- reduced motion: static completed composition ---------- */
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let tl = null;
  if (reduce){
    orbitState.rotation=STOP; updateOrbitPositions(); updateHand();
    byKey[SELECT].sel.style.opacity=.65;
    cards.filter(c=>c.k!==SELECT).forEach(c=>c.el.style.opacity=.62);
  } else {
    updateOrbitPositions(); updateHand();
    tl = buildTimeline();
    // pause while off-screen
    new IntersectionObserver(es=>{ es.forEach(e=> e.isIntersecting ? tl.play() : tl.pause()); },{threshold:0.05}).observe(root);
  }
  window.IntellicampFeatureOrbit = { timeline:()=>tl, config:CONFIG, update:()=>{updateOrbitPositions();updateHand();} };
})();
</script>
</body>
</html>
